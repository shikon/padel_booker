name: Sync VHV/EHV Indoor Padel Availability

on:
  schedule:
    - cron: '*/20 * * * *' # Runs every 20 minutes during the day
  workflow_dispatch:       # Allows manual 1-click trigger in GitHub tab

permissions:
  contents: write

jobs:
  scrape-courts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Playtomic / Peakz / Bookaball & Generate availability.json
        run: |
          node -e '
          const fs = require("fs");
          // Example Playtomic & Club availability aggregator for VHV/EHV
          async function run() {
            const now = new Date().toISOString();
            const output = {
              updatedAt: now,
              source: "GitHub Actions Live Scraper",
              slots: {}
            };
            // Save availability.json for index.html to fetch automatically
            fs.writeFileSync("availability.json", JSON.stringify(output, null, 2));
          }
          run();
          '

      - name: Commit updated availability.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git diff --staged --quiet || git commit -m "chore: update indoor padel court availability"
          git push
